<section class="place-filters">
  @if (showSearch()) {
    <label class="place-filters__search">
      <span>Cerca</span>
      <input
        type="search"
        placeholder="Ciutat, tag o lloc"
        [value]="filters().search"
        (input)="onSearch($event)"
      />
    </label>
  }

  @if (showCity()) {
    <app-territorial-location-selector
      class="place-filters__territory"
      [countryId]="filters().countryId || ''"
      [localityId]="filters().territorialUnitId || ''"
      [legacyCountry]="filters().country"
      [legacyLocality]="filters().city"
      (selectionChange)="onTerritorialSelection($event)"
    />
  }

  @if (showType()) {
    <label class="place-filters__standard place-filters__type">
      <span>{{ typeLabel() }}</span>
      <select [value]="filters().type" (change)="onType($event)">
        <option value="">Tots</option>
        @for (type of types(); track type.value) {
          <option [value]="type.value">{{ type.label }}</option>
        }
      </select>
    </label>
  }

  @if (showPet()) {
    <label class="place-filters__standard place-filters__pet">
      <span>Mascota</span>
      <select [value]="filters().pet" (change)="onPet($event)">
        <option value="all" [selected]="filters().pet === 'all'">Totes</option>
        <option value="dogs" [selected]="filters().pet === 'dogs'">Només gossos</option>
        <option value="cats" [selected]="filters().pet === 'cats'">Només gats</option>
      </select>
    </label>
  }

  @if (showSort()) {
    <label class="place-filters__standard place-filters__sort">
      <span>Ordre</span>
      <select [value]="sort()" (change)="onSort($event)">
        <option value="recent" [selected]="sort() === 'recent'">Més recents primer</option>
        <option value="rating" [selected]="sort() === 'rating'">Millor valorats primer</option>
        <option value="name" [selected]="sort() === 'name'">Nom A-Z</option>
      </select>
    </label>
  }

  @if (showClearButton()) {
    <button class="place-filters__standard" type="button" (click)="clear()">Netejar</button>
  }
</section>
