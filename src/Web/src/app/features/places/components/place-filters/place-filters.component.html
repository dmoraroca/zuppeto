<section class="place-filters">
  @if (showSearch()) {
    <label>
      <span>Cerca</span>
      <input
        type="search"
        placeholder="Ciutat, tag o lloc"
        [value]="filters().search"
        (input)="onSearch($event)"
      />
    </label>
  }

  @if (showCity()) {
    <label>
      <span>Ciutat</span>
      <app-city-combobox
        [value]="filters().city"
        (valueChange)="onCityChange($event)"
        [staticOptions]="cities()"
        [minCharsForRemote]="remoteCityMinChars()"
      />
    </label>
  }

  @if (showType()) {
    <label>
      <span>{{ typeLabel() }}</span>
      <select [value]="filters().type" (change)="onType($event)">
        <option value="">Tots</option>
        @for (type of types(); track type.value) {
          <option [value]="type.value">{{ type.label }}</option>
        }
      </select>
    </label>
  }

  @if (showPet()) {
    <label>
      <span>Mascota</span>
      <select [value]="filters().pet" (change)="onPet($event)">
        <option value="all" [selected]="filters().pet === 'all'">Totes</option>
        <option value="dogs" [selected]="filters().pet === 'dogs'">Només gossos</option>
        <option value="cats" [selected]="filters().pet === 'cats'">Només gats</option>
      </select>
    </label>
  }

  @if (showSort()) {
    <label>
      <span>Ordre</span>
      <select [value]="sort()" (change)="onSort($event)">
        <option value="recent" [selected]="sort() === 'recent'">Més recents primer</option>
        <option value="rating" [selected]="sort() === 'rating'">Millor valorats primer</option>
        <option value="name" [selected]="sort() === 'name'">Nom A-Z</option>
      </select>
    </label>
  }

  @if (showClearButton()) {
    <button type="button" (click)="clear()">Netejar</button>
  }
</section>
