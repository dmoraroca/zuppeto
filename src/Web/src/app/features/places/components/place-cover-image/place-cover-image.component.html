<div
  class="place-cover"
  [class.place-cover--hero]="variant() === 'hero'"
  [class.place-cover--related]="variant() === 'related'"
  [class.place-cover--card]="variant() === 'card'"
>
  @if (showImage()) {
    <img [src]="imageUrl()" [alt]="alt()" (error)="onImageError()" />
  } @else {
    <div
      class="place-cover__placeholder"
      role="img"
      [attr.aria-label]="caption() + ': ' + (placeName() || alt())"
    >
      <div class="place-cover__monogram" aria-hidden="true">{{ initials() }}</div>
      <p class="place-cover__caption place-cover__caption--diagonal">{{ caption() }}</p>
    </div>
  }
</div>
