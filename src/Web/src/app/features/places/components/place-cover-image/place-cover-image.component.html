<div
  class="place-cover"
  [class.place-cover--hero]="variant() === 'hero'"
  [class.place-cover--related]="variant() === 'related'"
>
  @if (showImage()) {
    <img [src]="imageUrl()" [alt]="alt()" (error)="onImageError()" />
  } @else {
    <div class="place-cover__placeholder" role="img" [attr.aria-label]="caption()">
      <svg
        class="place-cover__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3.5" y="5" width="17" height="14" rx="2" />
        <circle cx="9" cy="10" r="1.35" fill="currentColor" stroke="none" />
        <path d="M4 16.5l4.2-4.2a1.2 1.2 0 011.7 0l2.3 2.3 2.8-2.8a1.2 1.2 0 011.7 0L20 15.5" />
      </svg>
      <p class="place-cover__caption">{{ caption() }}</p>
    </div>
  }
</div>
