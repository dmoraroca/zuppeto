<main class="account-page"><section class="account-card">
  <p class="eyebrow">Compte nou</p><h1>Crea el teu compte</h1>
  @if (submitted()) { <p class="success">T’hem enviat un correu d’activació. Activa el compte abans d’iniciar sessió.</p><a routerLink="/login">Tornar a l’accés</a> }
  @else { <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Nom visible <input formControlName="displayName" autocomplete="name" /></label>
    <label>Email <input type="email" formControlName="email" autocomplete="email" /></label>
    <label>Contrasenya <input type="password" formControlName="password" autocomplete="new-password" /></label>
    @if (failed()) { <p class="error">No s’ha pogut crear el compte. Revisa les dades o prova-ho més tard.</p> }
    <button type="submit">Crear compte</button>
  </form><p>Ja tens compte? <a routerLink="/login">Inicia sessió</a></p> }
</section></main>
