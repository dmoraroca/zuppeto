<main class="account-page"><section class="account-card"><p class="eyebrow">Seguretat</p><h1>Estableix una contrasenya nova</h1>@if (status() === 'Reset') { <p class="success">La contrasenya s’ha actualitzat. Ja pots iniciar sessió.</p><a routerLink="/login">Iniciar sessió</a> } @else { <form [formGroup]="form" (ngSubmit)="submit()"><label>Contrasenya nova <input type="password" formControlName="newPassword" autocomplete="new-password" /></label><label>Confirmar contrasenya <input type="password" formControlName="confirmNewPassword" autocomplete="new-password" /></label><button type="submit">Desar contrasenya</button></form>@if (status() !== 'idle') { <p class="error">L’enllaç no és vàlid, ha caducat o ja s’ha utilitzat.</p> } }</section></main>
