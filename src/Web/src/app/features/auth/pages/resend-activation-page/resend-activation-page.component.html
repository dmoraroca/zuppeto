<main class="account-page"><section class="account-card">
  <p class="eyebrow">Activació de compte</p><h1>Reenvia l’activació</h1>
  @if (sent()) { <p>Si existeix un compte pendent amb aquest email, rebràs un nou enllaç d’activació.</p><a routerLink="/login">Tornar a l’accés</a> }
  @else { <form [formGroup]="form" (ngSubmit)="submit()"><label>Email <input type="email" formControlName="email" autocomplete="email" /></label><button type="submit">Reenviar</button></form> }
</section></main>
