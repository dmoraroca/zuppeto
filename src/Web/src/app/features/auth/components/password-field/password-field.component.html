<label class="password-field" [class.password-field--locked]="isLocked()">
  <span class="password-field__label">
    {{ label() }}
    @if (required()) {
      <strong class="form-field-required" aria-hidden="true">*</strong>
    }
  </span>

  <div class="password-field__input">
    <input
      [type]="visible() ? 'text' : 'password'"
      [formControl]="control()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-required]="required() || null"
      [attr.readonly]="isReadOnly() ? true : null"
      [attr.tabindex]="isLocked() ? -1 : 0"
      (focus)="onFocus()"
      (input)="onInput($event)"
    />
    <button
      type="button"
      class="password-field__toggle"
      (click)="toggleVisibility()"
      [attr.aria-label]="visible() ? 'Amagar ' + label() : 'Mostrar ' + label()"
      [attr.aria-pressed]="visible()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @if (visible()) {
          <path d="M3 3l18 18" />
          <path
            d="M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.8M6.1 6.1A17 17 0 0 0 2 12s4 7 10 7a10 10 0 0 0 3.8-.7"
          />
        } @else {
          <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        }
      </svg>
    </button>
  </div>

  @if (showStrength()) {
    <div
      class="password-field__strength"
      [class.password-field__strength--weak]="strength() === 'weak'"
      [class.password-field__strength--medium]="strength() === 'medium'"
      [class.password-field__strength--strong]="strength() === 'strong'"
    >
      <span class="password-field__strength-line" aria-hidden="true"></span>
      @if (strength() !== 'empty') {
        <span class="password-field__strength-label">{{ strengthLabel() }}</span>
      }
    </div>
  }

  @if (fieldError()) {
    <p class="password-field__error" role="alert">{{ fieldError() }}</p>
  }
</label>
