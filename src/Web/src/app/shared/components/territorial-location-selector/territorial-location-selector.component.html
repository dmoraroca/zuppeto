<div class="location-pair">
  <label>País
    <select [ngModel]="activeCountryId" (ngModelChange)="countryChanged($event)" [disabled]="disabled()" [attr.aria-required]="required()">
      <option value="">Selecciona un país</option>
      @for (country of countries; track country.id) { <option [value]="country.id">{{ country.name }}</option> }
    </select>
  </label>

  <label [for]="inputId">Localitat
    <div class="combobox">
      <input
        [id]="inputId"
        type="text"
        role="combobox"
        autocomplete="off"
        aria-autocomplete="list"
        [attr.aria-controls]="listboxId"
        [attr.aria-expanded]="open"
        [attr.aria-activedescendant]="open && activeIndex >= 0 ? optionId(activeIndex) : null"
        [attr.aria-required]="required()"
        [ngModel]="query"
        (ngModelChange)="queryChanged($event)"
        (focus)="focusLocality()"
        (keydown)="onKeydown($event)"
        [disabled]="disabled() || !activeCountryId"
        [placeholder]="activeCountryId ? 'Cerca una localitat' : 'Selecciona primer un país'"
      />

      @if (open) {
        <div class="results" [id]="listboxId" role="listbox" aria-label="Resultats de localitats">
          @if (loading) {
            <p class="state" role="status">Cercant localitats…</p>
          } @else if (error) {
            <p class="state state--error" role="alert">{{ error }}</p>
          } @else if (searched && !localities.length) {
            <p class="state" role="status">No s’han trobat localitats.</p>
          } @else {
            @for (locality of localities; track locality.id; let index = $index) {
              <button
                type="button"
                role="option"
                [id]="optionId(index)"
                [class.active]="activeIndex === index"
                [attr.aria-selected]="selectedLocalityId === locality.id"
                (mousedown)="$event.preventDefault()"
                (click)="selectLocality(locality)"
              >
                <strong>{{ locality.name }}</strong>
                <span>{{ locality.context }}</span>
              </button>
            }
          }
        </div>
      }
    </div>
  </label>
</div>
