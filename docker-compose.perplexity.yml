services:
  api:
    environment:
      Perplexity__Enabled: "${PERPLEXITY_ENABLED:-false}"
      PERPLEXITY_API_KEY_FILE: /run/secrets/perplexity_api_key
    secrets:
      - perplexity_api_key

secrets:
  perplexity_api_key:
    file: ${PERPLEXITY_API_KEY_FILE_HOST:-./.secrets/perplexity_api_key}
